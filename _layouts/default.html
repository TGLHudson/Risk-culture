<!doctype html>
<html lang="{{ site.lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.url != "/" %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_newlines | escape }}">
  <meta name="theme-color" content="#000718">
  {% if page.url == "/404.html" %}<meta name="robots" content="noindex">{% else %}<link rel="canonical" href="{{ page.url | absolute_url }}">{% endif %}
  <link rel="preload" href="{{ '/assets/fonts/source-sans-3-latin-400-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/montserrat-latin-600-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  {% include header.html %}
  <main id="main">
    {% if page.hero %}{% include hero.html %}{% endif %}
    <div class="wrap main-inner">
      {% unless page.hero %}<h1>{{ page.title }}</h1>{% endunless %}
      {{ content }}
    </div>
  </main>
  {% include footer.html %}
</body>
</html>
